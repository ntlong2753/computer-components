<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head th:replace="~{fragments/head :: head('Giỏ hàng - NexGen PC')}">
</head>
<body>

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5" style="min-height: 60vh;">
        <h2 class="mb-4 fw-bold">Giỏ hàng của bạn</h2>

        <div th:if="${cart == null or cart.items.isEmpty()}" class="alert alert-info text-center py-5">
            <h4>Giỏ hàng trống</h4>
            <p class="text-muted">Bạn chưa có sản phẩm nào trong giỏ hàng.</p>
            <a href="/" class="btn btn-primary mt-3">Tiếp tục mua sắm</a>
        </div>

        <div th:if="${cart != null and !cart.items.isEmpty()}">
            <div class="table-responsive shadow-sm rounded">
                <table class="table align-middle mb-0 bg-white">
                    <thead class="bg-light">
                        <tr>
                            <th style="width: 50px;">STT</th>
                            <th>Sản phẩm</th>
                            <th>Đơn giá</th>
                            <th style="width: 150px;">Số lượng</th>
                            <th>Thành tiền</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item, iterStat : ${cart.items}">
                            <td class="fw-bold text-center" th:text="${iterStat.count}">1</td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <img th:if="${item.imageUrl != null}" th:src="${item.imageUrl}" class="rounded shadow-sm" style="width: 60px; height: 60px; object-fit: cover; margin-right: 15px;" onerror="this.src='https://via.placeholder.com/60x60/1e293b/ffffff?text=No+Image'">
                                    <img th:unless="${item.imageUrl != null}" src="https://via.placeholder.com/60x60/1e293b/ffffff?text=No+Image" class="rounded shadow-sm" style="width: 60px; height: 60px; object-fit: cover; margin-right: 15px;">
                                    <div>
                                        <p class="fw-bold mb-1" th:text="${item.productName}">Tên sản phẩm</p>
                                        <small class="text-muted" th:text="'Kho: ' + ${item.stock}">Kho: 10</small>
                                    </div>
                                </div>
                            </td>
                            <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</td>
                            <td>
                                <input type="number" class="form-control form-control-sm text-center" 
                                       th:value="${item.quantity}" min="1" th:max="${item.stock}"
                                       th:onchange="'updateCartItem(' + ${item.productId} + ', this.value)'">
                            </td>
                            <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(item.price * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</td>
                            <td>
                                <button class="btn btn-sm btn-outline-danger" th:onclick="'removeCartItem(' + ${item.productId} + ')'">Xóa</button>
                            </td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="4" class="text-end fw-bold fs-5">Tổng cộng:</td>
                            <td colspan="2" class="fw-bold fs-4 text-danger" id="cart-total-price" th:text="${#numbers.formatDecimal(cart.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a href="/" class="btn btn-outline-secondary">← Tiếp tục mua sắm</a>
                <button class="btn btn-primary px-4 py-2 fw-bold" style="font-size: 1.1rem;">Tiến hành thanh toán →</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:src="@{/js/home.js}"></script>
    <script>
        function updateCartItem(productId, quantity) {
            const formData = new URLSearchParams();
            formData.append("productId", productId);
            formData.append("quantity", quantity);

            fetch('/api/cart/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    location.reload(); // Đơn giản nhất là reload lại trang để cập nhật UI
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function removeCartItem(productId) {
            if (!confirm('Bạn có chắc chắn muốn xóa sản phẩm này khỏi giỏ hàng?')) return;
            
            const formData = new URLSearchParams();
            formData.append("productId", productId);

            fetch('/api/cart/remove', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    location.reload();
                }
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
