<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/head :: head('Danh sách VGA')}"></div>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}" th:with="isAdminPage=true"></div>

    <div class="admin-layout">
        <div th:replace="~{fragments/admin_sidebar :: adminSidebar('vga')}"></div>
        
        <main class="admin-content">
            <div class="admin-header">
                <h1>Quản lý VGA</h1>
            </div>
            <button id="openCreateModalBtn" class="btn btn-primary mb-3">+ Thêm VGA mới</button>
            
            <div class="table-responsive bg-white rounded shadow-sm border">
                <table class="table table-hover mb-0 align-middle" id="vgaTable">
    <thead class="table-light">
    <tr>
        <th>STT</th>
        <th>Tên VGA</th>
        <th>Hãng GPU</th>
        <th>Model GPU</th>
        <th>Hãng card</th>
        <th>Dung lượng VRAM</th>
        <th>Loại VRAM</th>
        <th>Giá</th>
        <th>Tồn kho</th>
        <th>Mô tả</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="vga, iterStat : ${vgas}" th:id="'vga-row-' + ${vga.id}">
        <td th:text="${iterStat.count}"></td>
        <td th:text="${vga.name}"></td>
        <td th:text="${vga.gpuBrand}"></td>
        <td th:text="${vga.gpuModel}"></td>
        <td th:text="${vga.brand}"></td>
        <td th:text="${vga.vram != null ? vga.vram + ' GB' : ''}"></td>
        <td th:text="${vga.memoryType != null && !vga.memoryType.isBlank() ? vga.memoryType : ''}"></td>
        <td th:text="${vga.price}"></td>
        <td th:text="${vga.stock}"></td>
        <td th:text="${vga.description != null && !vga.description.isBlank() ? vga.description : 'không có mô tả'}"></td>
        <td>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-sm btn-outline-primary" th:onclick="'vgaManager.editItemModal(' + ${vga.id} + ')'">Sửa</button>
                <form th:action="@{/admin/vga/{id}/delete(id=${vga.id})}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Xóa VGA này?')">Xóa</button>
                </form>
            </div>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(vgas)}" id="emptyRow">
        <td colspan="11" class="text-center py-4 text-muted">Chưa có VGA nào.</td>
    </tr>
    </tbody>
</table>
</div>

<!-- Nhúng Modal Form vào đây -->
<div th:replace="~{vga/form :: vgaModalForm}"></div>
        </main>
    </div>
</body>
</html>
