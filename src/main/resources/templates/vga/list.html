<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách VGA</title>
</head>
<body>
<h1>Quản lý VGA</h1>
<button id="openCreateModalBtn">+ Thêm VGA mới</button>
<table border="1" cellpadding="8" cellspacing="0" style="margin-top:16px; border-collapse: collapse; width: 100%;" id="vgaTable">
    <thead>
    <tr>
        <th>STT</th>
        <th>Tên VGA</th>
        <th>Hãng GPU</th>
        <th>Model GPU</th>
        <th>Hãng card</th>
        <th>Dung lượng VRAM</th>
        <th>Loại VRAM</th>
        <th>Giá</th>
        <th>Tồn kho</th>
        <th>Mô tả</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="vga, iterStat : ${vgas}" th:id="'vga-row-' + ${vga.id}">
        <td th:text="${iterStat.count}"></td>
        <td th:text="${vga.name}"></td>
        <td th:text="${vga.gpuBrand}"></td>
        <td th:text="${vga.gpuModel}"></td>
        <td th:text="${vga.brand}"></td>
        <td th:text="${vga.vram != null ? vga.vram + ' GB' : ''}"></td>
        <td th:text="${vga.memoryType != null && !vga.memoryType.isBlank() ? vga.memoryType : ''}"></td>
        <td th:text="${vga.price}"></td>
        <td th:text="${vga.stock}"></td>
        <td th:text="${vga.description != null && !vga.description.isBlank() ? vga.description : 'không có mô tả'}"></td>
        <td>
            <button type="button" style="cursor:pointer;" th:onclick="'vgaManager.editItemModal(' + ${vga.id} + ')'">Sửa</button>
            &nbsp;|&nbsp;
            <form th:action="@{/admin/vga/{id}/delete(id=${vga.id})}" method="post" style="display:inline">
                <button type="submit" onclick="return confirm('Xóa VGA này?')">Xóa</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(vgas)}" id="emptyRow">
        <td colspan="11">Chưa có VGA nào.</td>
    </tr>
    </tbody>
</table>

<!-- Nhúng Modal Form vào đây -->
<div th:replace="~{vga/form :: vgaModalForm}"></div>
</body>
</html>
