<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="storageModalForm">
    <link rel="stylesheet" th:href="@{/css/modal.css}" />
    <link rel="stylesheet" th:href="@{/css/storage.css}" />

    <!-- The Modal -->
    <div class="modal fade" id="storageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 16px;">
                <div class="modal-header border-0 pb-0">
                    <h2 class="modal-title fs-4 fw-bold text-primary" id="modalTitle">Thêm Ổ cứng mới</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="closeModalBtn"></button>
                </div>
                
                <div class="modal-body">
                    <div class="alert alert-success d-none" id="successAlert" role="alert">Lưu thành công!</div>

                    <form id="storageAjaxForm">
                        <input type="hidden" name="id" id="storageId" />
                        <input type="hidden" name="deletedImageIds" id="deletedImageIds" value="" />

                        <!-- Loại ổ cứng -->
                        <div class="mb-3 p-3 bg-light rounded border border-primary">
                            <label class="form-label fw-bold text-primary">Loại ổ cứng:</label>
                            <select name="type" id="storageType" class="form-select border-primary shadow-sm">
                                <option value="SSD">SSD (Ổ cứng thể rắn)</option>
                                <option value="HDD">HDD (Ổ cứng cơ)</option>
                            </select>
                        </div>

                        <!-- 1. Tên Ổ cứng -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên ổ cứng (*):</label>
                            <input type="text" name="name" id="storageName" class="form-control" placeholder="Tự sinh, có thể sửa" />
                            <span class="text-danger small" id="err-name"></span>
                        </div>

                        <!-- 2. Hãng (Custom Dropdown) -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Hãng (*):</label>
                            <div class="custom-select-container" id="select-container-brand">
                                <input type="hidden" name="brand" id="storageBrand" value="" />
                                <div class="custom-select-trigger form-control d-flex justify-content-between align-items-center" onclick="storageManager.toggleDropdown('brand')">
                                    <span id="trigger-text-brand">-- Chọn Hãng --</span>
                                    <span>▼</span>
                                </div>
                                <div class="custom-dropdown-panel shadow-sm border rounded mt-1 bg-white">
                                    <ul class="custom-options-list list-unstyled m-0" id="options-list-brand"></ul>
                                    <div class="custom-add-box d-flex p-2 border-top">
                                        <input type="text" id="add-input-brand" class="form-control form-control-sm me-2" placeholder="Nhập Hãng mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();storageManager.addCustomOption('brand', 'add-input-brand');}" />
                                        <button type="button" class="btn btn-sm btn-primary text-nowrap" onclick="storageManager.addCustomOption('brand', 'add-input-brand')">+ Thêm</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 3. Dung lượng -->
                        <div class="mb-3 row align-items-end g-2">
                            <div class="col-8">
                                <label class="form-label fw-bold">Dung lượng (*):</label>
                                <input type="number" name="capacity" id="storageCapacity" class="form-control" placeholder="VD: 1, 500" min="1" oninput="storageManager.generateNameCallback()" />
                                <span class="text-danger small" id="err-capacity"></span>
                            </div>
                            <div class="col-4">
                                <select name="capacityUnit" id="storageCapacityUnit" class="form-select" onchange="storageManager.generateNameCallback()">
                                    <option value="GB">GB</option>
                                    <option value="TB" selected>TB</option>
                                </select>
                            </div>
                        </div>

                        <!-- SECTION: HDD Specific -->
                        <div id="hdd-fields" class="mb-4 p-3 rounded border border-warning" style="display: none; background-color: #fffcf0;">
                            <h4 class="fs-6 fw-bold text-warning mb-3">Thông số HDD</h4>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Tốc độ vòng quay (RPM):</label>
                                <input type="number" name="rpm" id="storageRpm" class="form-control" placeholder="VD: 7200, 5400" min="1" />
                            </div>
                        </div>

                        <!-- SECTION: SSD Specific -->
                        <div id="ssd-fields" class="mb-4 p-3 rounded border border-info bg-light">
                            <h4 class="fs-6 fw-bold text-info mb-3">Thông số SSD</h4>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Chuẩn kết nối:</label>
                                <div class="custom-select-container" id="select-container-connectionType">
                                    <input type="hidden" name="connectionType" id="storageConnectionType" value="" />
                                    <div class="custom-select-trigger form-control d-flex justify-content-between align-items-center" onclick="storageManager.toggleDropdown('connectionType')">
                                        <span id="trigger-text-connectionType">-- Chọn Chuẩn kết nối --</span>
                                        <span>▼</span>
                                    </div>
                                    <div class="custom-dropdown-panel shadow-sm border rounded mt-1 bg-white">
                                        <ul class="custom-options-list list-unstyled m-0" id="options-list-connectionType"></ul>
                                        <div class="custom-add-box d-flex p-2 border-top">
                                            <input type="text" id="add-input-connectionType" class="form-control form-control-sm me-2" placeholder="Nhập chuẩn mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();storageManager.addCustomOption('connectionType', 'add-input-connectionType');}" />
                                            <button type="button" class="btn btn-sm btn-primary text-nowrap" onclick="storageManager.addCustomOption('connectionType', 'add-input-connectionType')">+ Thêm</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Chuẩn PCIe (nếu NVMe):</label>
                                <div class="custom-select-container" id="select-container-pcieGen">
                                    <input type="hidden" name="pcieGen" id="storagePcieGen" value="" />
                                    <div class="custom-select-trigger form-control d-flex justify-content-between align-items-center" onclick="storageManager.toggleDropdown('pcieGen')">
                                        <span id="trigger-text-pcieGen">-- Chọn Chuẩn PCIe --</span>
                                        <span>▼</span>
                                    </div>
                                    <div class="custom-dropdown-panel shadow-sm border rounded mt-1 bg-white">
                                        <ul class="custom-options-list list-unstyled m-0" id="options-list-pcieGen"></ul>
                                        <div class="custom-add-box d-flex p-2 border-top">
                                            <input type="text" id="add-input-pcieGen" class="form-control form-control-sm me-2" placeholder="Nhập chuẩn mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();storageManager.addCustomOption('pcieGen', 'add-input-pcieGen');}" />
                                            <button type="button" class="btn btn-sm btn-primary text-nowrap" onclick="storageManager.addCustomOption('pcieGen', 'add-input-pcieGen')">+ Thêm</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label fw-bold">Tốc độ đọc (MB/s):</label>
                                    <input type="number" name="readSpeed" id="storageReadSpeed" class="form-control" placeholder="VD: 7000" min="1" />
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold">Tốc độ ghi (MB/s):</label>
                                    <input type="number" name="writeSpeed" id="storageWriteSpeed" class="form-control" placeholder="VD: 5000" min="1" />
                                </div>
                            </div>
                        </div>

                        <!-- Chung: Cache -->
                        <div class="mb-3 row align-items-end g-2">
                            <div class="col-8">
                                <label class="form-label fw-bold">Bộ nhớ đệm (Cache):</label>
                                <input type="number" name="cache" id="storageCache" class="form-control" placeholder="VD: 256" min="1" />
                            </div>
                            <div class="col-4">
                                <select name="cacheUnit" id="storageCacheUnit" class="form-select">
                                    <option value="MB">MB</option>
                                    <option value="GB">GB</option>
                                </select>
                            </div>
                        </div>

                        <hr class="my-4 text-muted" />

                        <!-- Fragment chứa Giá, Tồn kho, Ảnh, Mô tả -->
                        <div th:replace="~{common/product-fields :: fields(prefix='storage')}"></div>
                        <span class="text-danger small" id="err-general"></span>

                        <div class="modal-footer border-0 px-0 pb-0">
                            <button type="button" class="btn btn-secondary fw-bold px-4" id="cancelModalBtn" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary fw-bold px-4">Lưu</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng script chung và riêng -->
    <script th:src="@{/js/component-form.js}"></script>
    <script th:src="@{/js/storage.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const existingStorages = /*[[${storages}]]*/ [];
        /*]]>*/
    </script>
</div>
</body>
</html>
