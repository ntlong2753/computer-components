<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/head :: head('Danh sách RAM')}"></div>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}" th:with="isAdminPage=true"></div>

    <div class="admin-layout">
        <div th:replace="~{fragments/admin_sidebar :: adminSidebar('ram')}"></div>
        
        <main class="admin-content">
            <div class="admin-header">
                <h1>Quản lý RAM</h1>
            </div>
            <button id="openCreateModalBtn" class="btn btn-primary mb-3">+ Thêm RAM mới</button>
            
            <div class="table-responsive bg-white rounded shadow-sm border">
                <table class="table table-hover mb-0 align-middle" id="ramTable">
    <thead class="table-light">
    <tr>
        <th>STT</th>
        <th>Tên RAM</th>
        <th>Hãng</th>
        <th>Dung lượng (GB)</th>
        <th>Chuẩn RAM</th>
        <th>Bus RAM (MHz)</th>
        <th>Giá</th>
        <th>Tồn kho</th>
        <th>Mô tả</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ram, iterStat : ${rams}" th:id="'ram-row-' + ${ram.id}">
        <td th:text="${iterStat.count}"></td>
        <td th:text="${ram.name}"></td>
        <td th:text="${ram.brand}"></td>
        <td th:text="${ram.capacity}"></td>
        <td th:text="${ram.ramType}"></td>
        <td th:text="${ram.busSpeed}"></td>
        <td th:text="${ram.price}"></td>
        <td th:text="${ram.stock}"></td>
        <td th:text="${ram.description != null && !ram.description.isBlank() ? ram.description : 'không có mô tả'}"></td>
        <td>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-sm btn-outline-primary" th:onclick="'ramManager.editItemModal(' + ${ram.id} + ')'">Sửa</button>
                <form th:action="@{/admin/ram/{id}/delete(id=${ram.id})}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Xóa RAM này?')">Xóa</button>
                </form>
            </div>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(rams)}" id="emptyRow">
        <td colspan="10" class="text-center py-4 text-muted">Chưa có RAM nào.</td>
    </tr>
    </tbody>
</table>
</div>

<!-- Nhúng Modal Form vào đây -->
<div th:replace="~{ram/form :: ramModalForm}"></div>
        </main>
    </div>
</body>
</html>
