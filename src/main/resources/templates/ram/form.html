<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="ramModalForm">
    <link rel="stylesheet" th:href="@{/css/modal.css}" />
    <!-- The Modal -->
    <div class="modal fade" id="ramModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 16px;">
                <div class="modal-header border-0 pb-0">
                    <h2 class="modal-title fs-4 fw-bold text-primary" id="modalTitle">Thêm RAM mới</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="closeModalBtn"></button>
                </div>

                <div class="modal-body">
                    <div class="alert alert-success d-none" id="successAlert" role="alert">Lưu thành công!</div>

                    <form id="ramAjaxForm">
                        <input type="hidden" name="id" id="ramId" />
                        <input type="hidden" name="deletedImageIds" id="deletedImageIds" value="" />

                        <!-- 1. Tên RAM -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên RAM (*):</label>
                            <input type="text" name="name" id="ramName" class="form-control" placeholder="Tự sinh, có thể sửa" />
                            <span class="text-danger small" id="err-name"></span>
                        </div>

                        <!-- 2. Hãng (Custom Dropdown) -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Hãng (*):</label>
                            <div class="custom-select-container" id="select-container-brand">
                                <input type="hidden" name="brand" id="ramBrand" value="" />
                                <div class="custom-select-trigger form-control d-flex justify-content-between align-items-center" onclick="ramManager.toggleDropdown('brand')">
                                    <span id="trigger-text-brand">-- Chọn Hãng --</span>
                                    <span>▼</span>
                                </div>
                                <div class="custom-dropdown-panel shadow-sm border rounded mt-1 bg-white">
                                    <ul class="custom-options-list list-unstyled m-0" id="options-list-brand"></ul>
                                    <div class="custom-add-box d-flex p-2 border-top">
                                        <input type="text" id="add-input-brand" class="form-control form-control-sm me-2" placeholder="Nhập Hãng mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();ramManager.addCustomOption('brand', 'add-input-brand');}" />
                                        <button type="button" class="btn btn-sm btn-primary text-nowrap" onclick="ramManager.addCustomOption('brand', 'add-input-brand')">+ Thêm</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 3. Dung lượng (GB) -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Dung lượng (GB) (*):</label>
                            <input type="number" name="capacity" id="ramCapacity" class="form-control" placeholder="VD: 8, 16, 32" min="1" oninput="ramManager.generateNameCallback()" />
                            <span class="text-danger small" id="err-capacity"></span>
                        </div>

                        <!-- 4. Chuẩn RAM (Custom Dropdown) -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Chuẩn RAM:</label>
                            <div class="custom-select-container" id="select-container-ramType">
                                <input type="hidden" name="ramType" id="ramRamType" value="" />
                                <div class="custom-select-trigger form-control d-flex justify-content-between align-items-center" onclick="ramManager.toggleDropdown('ramType')">
                                    <span id="trigger-text-ramType">-- Chọn Chuẩn RAM --</span>
                                    <span>▼</span>
                                </div>
                                <div class="custom-dropdown-panel shadow-sm border rounded mt-1 bg-white">
                                    <ul class="custom-options-list list-unstyled m-0" id="options-list-ramType"></ul>
                                    <div class="custom-add-box d-flex p-2 border-top">
                                        <input type="text" id="add-input-ramType" class="form-control form-control-sm me-2" placeholder="Nhập Chuẩn RAM mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();ramManager.addCustomOption('ramType', 'add-input-ramType');}" />
                                        <button type="button" class="btn btn-sm btn-primary text-nowrap" onclick="ramManager.addCustomOption('ramType', 'add-input-ramType')">+ Thêm</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 5. Bus RAM (MHz) -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Bus RAM (MHz) (*):</label>
                            <input type="number" name="busSpeed" id="ramBusSpeed" class="form-control" placeholder="VD: 3200, 5600" min="1" oninput="ramManager.generateNameCallback()" />
                            <span class="text-danger small" id="err-busSpeed"></span>
                        </div>

                        <!-- Fragment chứa Giá, Tồn kho, Ảnh, Mô tả -->
                        <div th:replace="~{common/product-fields :: fields(prefix='ram')}"></div>
                        <span class="text-danger small" id="err-general"></span>

                        <div class="modal-footer border-0 px-0 pb-0">
                            <button type="button" class="btn btn-secondary fw-bold px-4" id="cancelModalBtn" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary fw-bold px-4" id="saveBtn">Lưu</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng script chung và riêng với cache-buster để trình duyệt nhận bản mới nhất -->
    <script th:src="@{/js/component-form.js}"></script>
    <script th:src="@{/js/ram.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const existingRams = /*[[${rams}]]*/ [];
        /*]]>*/
    </script>
</div>
</body>
</html>
