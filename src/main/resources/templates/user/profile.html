<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/head :: head('Thông tin tài khoản - NexGen PC')}"></div>
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}" th:with="isAdminPage=false"></div>

    <div class="container">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show mt-4" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-4" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="profile-container">
            <div class="row">
                <!-- Sidebar -->
                <div th:replace="~{fragments/profile/sidebar :: sidebar}"></div>

                <!-- Content -->
                <div class="col-md-9 ps-md-5 mt-4 mt-md-0">
                    <div class="tab-content" id="v-pills-tabContent">
                        <!-- 1. Thông tin tài khoản -->
                        <div th:replace="~{fragments/profile/tab_info :: tab_info}"></div>

                        <!-- 2. Thông tin đơn hàng -->
                        <div th:replace="~{fragments/profile/tab_orders :: tab_orders}" sec:authorize="!hasAuthority('ROLE_ADMIN')"></div>

                        <!-- 3. Các địa chỉ được lưu -->
                        <div th:replace="~{fragments/profile/tab_address :: tab_address}" sec:authorize="!hasAuthority('ROLE_ADMIN')"></div>

                        <!-- 4. Thay đổi mật khẩu -->
                        <div th:replace="~{fragments/profile/tab_password :: tab_password}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Address Modal -->
    <div th:replace="~{fragments/profile/modal_address :: modal_address}"></div>

    <script th:src="@{/js/profile.js(v=1)}"></script>
</body>
</html>
