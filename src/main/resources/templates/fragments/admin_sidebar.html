<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <aside class="admin-sidebar" th:fragment="adminSidebar(activeMenu)">
        <div class="sidebar-header">
            <a href="/admin" class="sidebar-brand text-white fw-bold fs-5 text-decoration-none d-flex align-items-center gap-2">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                NexGen Admin
            </a>
        </div>

        <nav class="sidebar-nav">
            <div class="admin-sidebar-title">QUẢN TRỊ</div>
            <a href="/admin" class="admin-nav-item" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}">
                <div class="sidebar-item-icon">📊</div>
                <span>Tổng quan</span>
            </a>

            <div class="admin-sidebar-title">QUẢN LÝ SẢN PHẨM</div>
            <a href="/admin/cpu" class="admin-nav-item" th:classappend="${activeMenu == 'cpu' ? 'active' : ''}">
                <div class="sidebar-item-icon">🔲</div>
                <span>Vi xử lý (CPU)</span>
            </a>
            <a href="/admin/mainboard" class="admin-nav-item" th:classappend="${activeMenu == 'mainboard' ? 'active' : ''}">
                <div class="sidebar-item-icon">🛠️</div>
                <span>Bo mạch chủ (Mainboard)</span>
            </a>
            <a href="/admin/ram" class="admin-nav-item" th:classappend="${activeMenu == 'ram' ? 'active' : ''}">
                <div class="sidebar-item-icon">📼</div>
                <span>Bộ nhớ trong (RAM)</span>
            </a>
            <a href="/admin/vga" class="admin-nav-item" th:classappend="${activeMenu == 'vga' ? 'active' : ''}">
                <div class="sidebar-item-icon">🎮</div>
                <span>Card màn hình (VGA)</span>
            </a>
            <a href="/admin/storage" class="admin-nav-item" th:classappend="${activeMenu == 'storage' ? 'active' : ''}">
                <div class="sidebar-item-icon">💾</div>
                <span>Ổ cứng (SSD/HDD)</span>
            </a>
            <a href="/admin/psu" class="admin-nav-item" th:classappend="${activeMenu == 'psu' ? 'active' : ''}">
                <div class="sidebar-item-icon">⚡</div>
                <span>Nguồn máy tính (PSU)</span>
            </a>

            <div class="admin-sidebar-title">HỆ THỐNG</div>
            <a href="#" class="admin-nav-item" th:classappend="${activeMenu == 'orders' ? 'active' : ''}">
                <div class="sidebar-item-icon">📦</div>
                <span>Đơn hàng</span>
            </a>
            <a href="#" class="admin-nav-item" th:classappend="${activeMenu == 'users' ? 'active' : ''}">
                <div class="sidebar-item-icon">👥</div>
                <span>Người dùng</span>
            </a>
            
        </nav>
    </aside>
</body>
</html>
