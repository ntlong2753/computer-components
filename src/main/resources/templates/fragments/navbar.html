<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <nav class="navbar navbar-expand-lg px-4" th:fragment="navbar" style="background-color: var(--primary);">
    <div class="container-fluid">
        <a class="navbar-brand text-white fw-bold fs-4" href="/">NexGen PC</a>
        
        <button class="navbar-toggler border-white text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav align-items-center gap-2">
                <li class="nav-item">
                    <a class="nav-link text-white d-flex align-items-center gap-2 px-3 custom-nav-link" href="/">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        <span class="lh-sm" style="font-size: 14px; font-weight: 500;">Trang<br>Chủ</span>
                    </a>
                </li>

                <li class="nav-item" th:unless="${isAdminPage}" sec:authorize="!hasRole('ADMIN')">
                    <a class="nav-link text-white d-flex align-items-center gap-2 px-3 custom-nav-link" href="#">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <span class="lh-sm" style="font-size: 14px; font-weight: 500;">Tra cứu<br>đơn hàng</span>
                    </a>
                </li>

                <li class="nav-item" th:unless="${isAdminPage}" sec:authorize="!hasRole('ADMIN')">
                    <a class="nav-link text-white d-flex align-items-center gap-2 px-3 custom-nav-link" href="#">
                        <div class="position-relative">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark border border-white" style="font-size: 10px;">0</span>
                        </div>
                        <span class="lh-sm" style="font-size: 14px; font-weight: 500;">Giỏ<br>hàng</span>
                    </a>
                </li>

                <!-- Chưa đăng nhập -->
                <li class="nav-item dropdown" sec:authorize="!isAuthenticated()">
                    <a class="nav-link text-white d-flex align-items-center gap-2 px-3 custom-nav-link bg-black bg-opacity-10 rounded dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <span class="lh-sm" style="font-size: 14px; font-weight: 500;">Tài khoản</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                        <li><a class="dropdown-item py-2 fw-bold" href="/login">Đăng nhập</a></li>
                        <li><a class="dropdown-item py-2" href="/register">Đăng ký tài khoản</a></li>
                    </ul>
                </li>

                <!-- Đã đăng nhập -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link text-white d-flex align-items-center gap-2 px-3 custom-nav-link bg-black bg-opacity-10 rounded dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <img th:if="${#authentication.principal instanceof T(com.codegym.computercomponents.security.CustomUserDetails) and #authentication.principal.avatarUrl != null}" 
                             th:src="${#authentication.principal.avatarUrl}" 
                             alt="Avatar" class="rounded-circle border border-white" style="width: 32px; height: 32px; object-fit: cover; background: #fff;">
                        <svg th:unless="${#authentication.principal instanceof T(com.codegym.computercomponents.security.CustomUserDetails) and #authentication.principal.avatarUrl != null}" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bg-white text-dark rounded-circle p-1"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <span class="lh-sm text-start" style="font-size: 14px; font-weight: 500;">
                            Xin chào,<br><span th:text="${#authentication.principal instanceof T(com.codegym.computercomponents.security.CustomUserDetails) ? #authentication.principal.fullName : #authentication.name}" class="fw-bold">User</span>
                        </span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                        <!-- Admin Only -->
                        <li sec:authorize="hasRole('ADMIN')">
                            <a class="dropdown-item fw-bold text-danger py-2" href="/admin">⚙️ Trang Quản Trị (Admin)</a>
                        </li>
                        <li sec:authorize="hasRole('ADMIN')"><hr class="dropdown-divider"></li>
                        
                        <li><a class="dropdown-item py-2" href="/profile">Thông tin tài khoản</a></li>
                        <li sec:authorize="!hasRole('ADMIN')"><a class="dropdown-item py-2" href="#">Đơn hàng của tôi</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0 px-2 pb-1">
                                <button type="submit" class="btn btn-outline-dark w-100 fw-bold">Đăng xuất</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
