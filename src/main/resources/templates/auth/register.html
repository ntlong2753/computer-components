<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - NexGen PC</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 40px 0;
        }
        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .auth-card h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); }
        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-card);
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 1rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .error-msg { color: #fca5a5; font-size: 0.85rem; margin-top: 5px; display: block;}
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            box-shadow: 0 0 15px var(--primary);
        }
        .auth-links { text-align: center; margin-top: 15px; }
        .auth-links a { color: var(--primary); text-decoration: none; }
        .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">NexGen PC</div>
        <div class="nav-links"><a href="/">Quay lại Trang chủ</a></div>
    </nav>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Đăng ký tài khoản</h2>
            
            <div th:if="${error}" class="alert-error" th:text="${error}"></div>

            <form th:action="@{/register}" method="post" th:object="${userDto}">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" th:field="*{username}" />
                    <span class="error-msg" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" th:field="*{password}" />
                    <span class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>
                <div class="form-group">
                    <label>Họ và tên</label>
                    <input type="text" th:field="*{fullName}" />
                    <span class="error-msg" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" />
                    <span class="error-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="text" th:field="*{phone}" />
                    <span class="error-msg" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                </div>
                <div class="form-group">
                    <label>Địa chỉ</label>
                    <input type="text" th:field="*{address}" />
                    <span class="error-msg" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
                </div>
                <button type="submit" class="btn-submit">Đăng ký</button>
            </form>
            <div class="auth-links">
                <p>Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
            </div>
        </div>
    </div>
</body>
</html>
