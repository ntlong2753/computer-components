<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - NexGen PC</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .auth-card h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); }
        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-card);
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 1rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover {
            box-shadow: 0 0 15px var(--primary);
        }
        .auth-links { text-align: center; margin-top: 15px; }
        .auth-links a { color: var(--primary); text-decoration: none; }
        .alert { padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; }
        .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
        .alert-success { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #86efac; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">NexGen PC</div>
        <div class="nav-links"><a href="/">Quay lại Trang chủ</a></div>
    </nav>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Đăng nhập</h2>
            
            <div th:if="${param.error}" class="alert alert-error">
                Tài khoản hoặc mật khẩu không chính xác!
            </div>
            <div th:if="${param.registered}" class="alert alert-success">
                Đăng ký thành công! Hãy đăng nhập.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                Bạn đã đăng xuất.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" name="username" required autofocus />
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" name="password" required />
                </div>
                <button type="submit" class="btn-submit">Đăng nhập</button>
            </form>
            <div class="auth-links">
                <p>Chưa có tài khoản? <a href="/register">Đăng ký ngay</a></p>
            </div>
        </div>
    </div>
</body>
</html>
