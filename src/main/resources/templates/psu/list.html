<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/head :: head('Danh sách Nguồn máy tính (PSU)')}"></div>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}" th:with="isAdminPage=true"></div>

    <div class="admin-layout">
        <div th:replace="~{fragments/admin_sidebar :: adminSidebar('psu')}"></div>
        
        <main class="admin-content">
            <div class="admin-header">
                <h1>Quản lý Nguồn (PSU)</h1>
            </div>
            
            <button id="openCreateModalBtn" class="btn btn-primary mb-3">+ Thêm Nguồn mới</button>
            
            <div class="table-responsive bg-white rounded shadow-sm border">
                <table class="table table-hover mb-0 align-middle" id="psuTable">
    <thead class="table-light">
    <tr>
        <th>STT</th>
        <th>Tên PSU</th>
        <th>Hãng</th>
        <th>Công suất</th>
        <th>Chuẩn nguồn</th>
        <th>Kích thước</th>
        <th>Giá</th>
        <th>Tồn kho</th>
        <th>Mô tả</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item, iterStat : ${psus}" th:id="'psu-row-' + ${item.id}">
        <td th:text="${iterStat.count}"></td>
        <td th:text="${item.name}"></td>
        <td th:text="${item.brand}"></td>
        <td th:text="${item.wattage != null ? item.wattage + 'W' : ''}"></td>
        <td th:text="${item.efficiency}"></td>
        <td th:text="${item.formFactor}"></td>
        <td th:text="${item.price}"></td>
        <td th:text="${item.stock}"></td>
        <td th:text="${item.description != null && !item.description.isBlank() ? item.description : 'không có mô tả'}"></td>
        <td>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-sm btn-outline-primary" th:onclick="'psuManager.editItemModal(' + ${item.id} + ')'">Sửa</button>
                <form th:action="@{/admin/psu/{id}/delete(id=${item.id})}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Xóa Nguồn này?')">Xóa</button>
                </form>
            </div>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(psus)}" id="emptyRow">
        <td colspan="10" class="text-center py-4 text-muted">Chưa có Nguồn nào.</td>
    </tr>
    </tbody>
</table>
</div>

<!-- Nhúng Modal Form vào đây -->
<div th:replace="~{psu/form :: psuModalForm}"></div>
        </main>
    </div>
</body>
</html>
