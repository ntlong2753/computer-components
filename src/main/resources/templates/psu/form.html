<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="psuModalForm">
    <link rel="stylesheet" th:href="@{/css/modal.css}" />

    <!-- The Modal -->
    <div id="psuModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <h2 id="modalTitle">Thêm Nguồn mới</h2>
            
            <div class="success-alert" id="successAlert">Lưu thành công!</div>

            <form id="psuAjaxForm">
                <input type="hidden" name="id" id="psuId" />
                <input type="hidden" name="deletedImageIds" id="deletedImageIds" value="" />

                <!-- 1. Tên PSU -->
                <div class="form-group">
                    <label>Tên PSU (*):</label>
                    <input type="text" name="name" id="psuName" placeholder="Tự sinh, có thể sửa" />
                    <span class="error-msg" id="err-name"></span>
                </div>

                <!-- 2. Hãng (Custom Dropdown) -->
                <div class="form-group">
                    <label>Hãng (*):</label>
                    <div class="custom-select-container" id="select-container-brand">
                        <input type="hidden" name="brand" id="psuBrand" value="" />
                        <div class="custom-select-trigger" onclick="psuManager.toggleDropdown('brand')">
                            <span id="trigger-text-brand">-- Chọn Hãng --</span>
                            <span>▼</span>
                        </div>
                        <div class="custom-dropdown-panel">
                            <ul class="custom-options-list" id="options-list-brand"></ul>
                            <div class="custom-add-box">
                                <input type="text" id="add-input-brand" placeholder="Nhập Hãng mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();psuManager.addCustomOption('brand', 'add-input-brand');}" />
                                <button type="button" onclick="psuManager.addCustomOption('brand', 'add-input-brand')">+ Thêm</button>
                            </div>
                        </div>
                    </div>
                    <span class="error-msg" id="err-brand"></span>
                </div>

                <!-- 3. Công suất -->
                <div class="form-group">
                    <label>Công suất (W) (*):</label>
                    <div class="custom-select-container" id="select-container-wattage">
                        <input type="hidden" name="wattage" id="psuWattage" value="" />
                        <div class="custom-select-trigger" onclick="psuManager.toggleDropdown('wattage')">
                            <span id="trigger-text-wattage">-- Chọn Công suất --</span>
                            <span>▼</span>
                        </div>
                        <div class="custom-dropdown-panel">
                            <ul class="custom-options-list" id="options-list-wattage"></ul>
                            <div class="custom-add-box">
                                <input type="number" id="add-input-wattage" placeholder="Nhập công suất mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();psuManager.addCustomOption('wattage', 'add-input-wattage');}" />
                                <button type="button" onclick="psuManager.addCustomOption('wattage', 'add-input-wattage')">+ Thêm</button>
                            </div>
                        </div>
                    </div>
                    <span class="error-msg" id="err-wattage"></span>
                </div>

                <!-- 4. Chuẩn nguồn -->
                <div class="form-group">
                    <label>Chuẩn nguồn (*):</label>
                    <div class="custom-select-container" id="select-container-efficiency">
                        <input type="hidden" name="efficiency" id="psuEfficiency" value="" />
                        <div class="custom-select-trigger" onclick="psuManager.toggleDropdown('efficiency')">
                            <span id="trigger-text-efficiency">-- Chọn Chuẩn nguồn --</span>
                            <span>▼</span>
                        </div>
                        <div class="custom-dropdown-panel">
                            <ul class="custom-options-list" id="options-list-efficiency"></ul>
                            <div class="custom-add-box">
                                <input type="text" id="add-input-efficiency" placeholder="Nhập Chuẩn nguồn mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();psuManager.addCustomOption('efficiency', 'add-input-efficiency');}" />
                                <button type="button" onclick="psuManager.addCustomOption('efficiency', 'add-input-efficiency')">+ Thêm</button>
                            </div>
                        </div>
                    </div>
                    <span class="error-msg" id="err-efficiency"></span>
                </div>

                <!-- 5. Kích thước -->
                <div class="form-group">
                    <label>Kích thước (*):</label>
                    <div class="custom-select-container" id="select-container-formFactor">
                        <input type="hidden" name="formFactor" id="psuFormFactor" value="" />
                        <div class="custom-select-trigger" onclick="psuManager.toggleDropdown('formFactor')">
                            <span id="trigger-text-formFactor">-- Chọn Kích thước --</span>
                            <span>▼</span>
                        </div>
                        <div class="custom-dropdown-panel">
                            <ul class="custom-options-list" id="options-list-formFactor"></ul>
                            <div class="custom-add-box">
                                <input type="text" id="add-input-formFactor" placeholder="Nhập Kích thước mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();psuManager.addCustomOption('formFactor', 'add-input-formFactor');}" />
                                <button type="button" onclick="psuManager.addCustomOption('formFactor', 'add-input-formFactor')">+ Thêm</button>
                            </div>
                        </div>
                    </div>
                    <span class="error-msg" id="err-formFactor"></span>
                </div>

                <!-- Fragment chứa Giá, Tồn kho, Ảnh, Mô tả -->
                <div th:replace="~{common/product-fields :: fields(prefix='psu')}"></div>
                <span class="error-msg" id="err-general"></span>

                <div class="modal-footer">
                    <button type="button" id="cancelModalBtn">Hủy</button>
                    <button type="submit">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Nhúng script chung và riêng -->
    <script th:src="@{/js/component-form.js}"></script>
    <script th:src="@{/js/psu.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const existingPsus = /*[[${psus}]]*/ [];
        /*]]>*/
    </script>
</div>
</body>
</html>
