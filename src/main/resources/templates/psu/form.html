<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="psuModalForm">
    <link rel="stylesheet" th:href="@{/css/modal.css}" />

    <!-- The Modal -->
    <div class="modal fade" id="psuModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 16px;">
                <div class="modal-header border-0 pb-0">
                    <h2 class="modal-title fs-4 fw-bold text-primary" id="modalTitle">Thêm Nguồn mới</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="closeModalBtn"></button>
                </div>
                
                <div class="modal-body">
                    <div class="alert alert-success d-none" id="successAlert" role="alert">Lưu thành công!</div>

                    <form id="psuAjaxForm">
                        <input type="hidden" name="id" id="psuId" />
                        <input type="hidden" name="deletedImageIds" id="deletedImageIds" value="" />

                        <!-- 1. Tên PSU -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên PSU (*):</label>
                            <input type="text" name="name" id="psuName" class="form-control" placeholder="Tự sinh, có thể sửa" />
                            <span class="text-danger small" id="err-name"></span>
                        </div>

                        <!-- 2. Hãng (Custom Dropdown) -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Hãng (*):</label>
                            <div class="custom-select-container" id="select-container-brand">
                                <input type="hidden" name="brand" id="psuBrand" value="" />
                                <div class="custom-select-trigger form-control d-flex justify-content-between align-items-center" onclick="psuManager.toggleDropdown('brand')">
                                    <span id="trigger-text-brand">-- Chọn Hãng --</span>
                                    <span>▼</span>
                                </div>
                                <div class="custom-dropdown-panel shadow-sm border rounded mt-1 bg-white">
                                    <ul class="custom-options-list list-unstyled m-0" id="options-list-brand"></ul>
                                    <div class="custom-add-box d-flex p-2 border-top">
                                        <input type="text" id="add-input-brand" class="form-control form-control-sm me-2" placeholder="Nhập Hãng mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();psuManager.addCustomOption('brand', 'add-input-brand');}" />
                                        <button type="button" class="btn btn-sm btn-primary text-nowrap" onclick="psuManager.addCustomOption('brand', 'add-input-brand')">+ Thêm</button>
                                    </div>
                                </div>
                            </div>
                            <span class="text-danger small" id="err-brand"></span>
                        </div>

                        <!-- 3. Công suất -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Công suất (W) (*):</label>
                            <div class="custom-select-container" id="select-container-wattage">
                                <input type="hidden" name="wattage" id="psuWattage" value="" />
                                <div class="custom-select-trigger form-control d-flex justify-content-between align-items-center" onclick="psuManager.toggleDropdown('wattage')">
                                    <span id="trigger-text-wattage">-- Chọn Công suất --</span>
                                    <span>▼</span>
                                </div>
                                <div class="custom-dropdown-panel shadow-sm border rounded mt-1 bg-white">
                                    <ul class="custom-options-list list-unstyled m-0" id="options-list-wattage"></ul>
                                    <div class="custom-add-box d-flex p-2 border-top">
                                        <input type="number" id="add-input-wattage" class="form-control form-control-sm me-2" placeholder="Nhập công suất mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();psuManager.addCustomOption('wattage', 'add-input-wattage');}" />
                                        <button type="button" class="btn btn-sm btn-primary text-nowrap" onclick="psuManager.addCustomOption('wattage', 'add-input-wattage')">+ Thêm</button>
                                    </div>
                                </div>
                            </div>
                            <span class="text-danger small" id="err-wattage"></span>
                        </div>

                        <!-- 4. Chuẩn nguồn -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Chuẩn nguồn (*):</label>
                            <div class="custom-select-container" id="select-container-efficiency">
                                <input type="hidden" name="efficiency" id="psuEfficiency" value="" />
                                <div class="custom-select-trigger form-control d-flex justify-content-between align-items-center" onclick="psuManager.toggleDropdown('efficiency')">
                                    <span id="trigger-text-efficiency">-- Chọn Chuẩn nguồn --</span>
                                    <span>▼</span>
                                </div>
                                <div class="custom-dropdown-panel shadow-sm border rounded mt-1 bg-white">
                                    <ul class="custom-options-list list-unstyled m-0" id="options-list-efficiency"></ul>
                                    <div class="custom-add-box d-flex p-2 border-top">
                                        <input type="text" id="add-input-efficiency" class="form-control form-control-sm me-2" placeholder="Nhập Chuẩn nguồn mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();psuManager.addCustomOption('efficiency', 'add-input-efficiency');}" />
                                        <button type="button" class="btn btn-sm btn-primary text-nowrap" onclick="psuManager.addCustomOption('efficiency', 'add-input-efficiency')">+ Thêm</button>
                                    </div>
                                </div>
                            </div>
                            <span class="text-danger small" id="err-efficiency"></span>
                        </div>

                        <!-- 5. Kích thước -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Kích thước (*):</label>
                            <div class="custom-select-container" id="select-container-formFactor">
                                <input type="hidden" name="formFactor" id="psuFormFactor" value="" />
                                <div class="custom-select-trigger form-control d-flex justify-content-between align-items-center" onclick="psuManager.toggleDropdown('formFactor')">
                                    <span id="trigger-text-formFactor">-- Chọn Kích thước --</span>
                                    <span>▼</span>
                                </div>
                                <div class="custom-dropdown-panel shadow-sm border rounded mt-1 bg-white">
                                    <ul class="custom-options-list list-unstyled m-0" id="options-list-formFactor"></ul>
                                    <div class="custom-add-box d-flex p-2 border-top">
                                        <input type="text" id="add-input-formFactor" class="form-control form-control-sm me-2" placeholder="Nhập Kích thước mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();psuManager.addCustomOption('formFactor', 'add-input-formFactor');}" />
                                        <button type="button" class="btn btn-sm btn-primary text-nowrap" onclick="psuManager.addCustomOption('formFactor', 'add-input-formFactor')">+ Thêm</button>
                                    </div>
                                </div>
                            </div>
                            <span class="text-danger small" id="err-formFactor"></span>
                        </div>

                        <hr class="my-4 text-muted" />

                        <!-- Fragment chứa Giá, Tồn kho, Ảnh, Mô tả -->
                        <div th:replace="~{common/product-fields :: fields(prefix='psu')}"></div>
                        <span class="text-danger small" id="err-general"></span>

                        <div class="modal-footer border-0 px-0 pb-0">
                            <button type="button" class="btn btn-secondary fw-bold px-4" id="cancelModalBtn" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary fw-bold px-4">Lưu</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng script chung và riêng -->
    <script th:src="@{/js/component-form.js}"></script>
    <script th:src="@{/js/psu.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const existingPsus = /*[[${psus}]]*/ [];
        /*]]>*/
    </script>
</div>
</body>
</html>
