<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thông tin CPU</title>
</head>
<body>
<h1 th:text="${cpu.id} != null ? 'Sửa CPU' : 'Thêm CPU mới'"></h1>
<p><em>Thông tin sản phẩm</em></p>
<form th:action="@{/admin/cpu}" th:object="${cpu}" method="post">
    <input type="hidden" th:field="*{id}"/>

    <div>
        <label>Tên sản phẩm:</label>
        <input type="text" th:field="*{name}"/>
        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red"></span>
    </div>

    
</form>
</body>
</html>
