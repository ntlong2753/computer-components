<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="cpuModalForm">
    <link rel="stylesheet" th:href="@{/css/modal.css}" />
<!-- The Modal -->
<div class="modal fade" id="cpuModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 16px;">
            <div class="modal-header border-0 pb-0">
                <h2 class="modal-title fs-4 fw-bold text-primary" id="modalTitle">Thêm CPU mới</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="closeModalBtn"></button>
            </div>
            
            <div class="modal-body">
                <div class="alert alert-success d-none" id="successAlert" role="alert">Lưu thành công!</div>

                <form id="cpuAjaxForm">
                    <input type="hidden" name="id" id="cpuId" />
                    
                    <!-- 1. Tên CPU -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên CPU (*):</label>
                        <input type="text" name="name" id="cpuName" class="form-control" placeholder="Tên CPU sẽ tự động sinh hoặc tự sửa..." />
                        <div class="form-text">(Tự động sinh theo cấu trúc [Hãng] [Dòng] [Phân khúc] [Model][Hậu tố], có thể chỉnh sửa)</div>
                        <span class="text-danger small" id="err-name"></span>
                    </div>

                    <!-- 2. Hãng CPU (Custom Dropdown) -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Hãng CPU (*):</label>
                        <div class="custom-select-container" id="select-container-brand">
                            <input type="hidden" name="brand" id="cpuBrand" value="" />
                            <div class="custom-select-trigger form-control d-flex justify-content-between align-items-center" onclick="cpuManager.toggleDropdown('brand')">
                                <span id="trigger-text-brand">-- Chọn Hãng --</span>
                                <span>▼</span>
                            </div>
                            <div class="custom-dropdown-panel shadow-sm border rounded mt-1 bg-white">
                                <ul class="custom-options-list list-unstyled m-0" id="options-list-brand"></ul>
                                <div class="custom-add-box d-flex p-2 border-top">
                                    <input type="text" id="add-input-brand" class="form-control form-control-sm me-2" placeholder="Nhập Hãng CPU mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();cpuManager.addCustomOption('brand', 'add-input-brand');}" />
                                    <button type="button" class="btn btn-sm btn-primary text-nowrap" onclick="cpuManager.addCustomOption('brand', 'add-input-brand')">+ Thêm</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 3. Dòng sản phẩm (Custom Dropdown) -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Dòng sản phẩm:</label>
                        <div class="custom-select-container" id="select-container-series">
                            <input type="hidden" name="series" id="cpuSeries" value="" />
                            <div class="custom-select-trigger form-control d-flex justify-content-between align-items-center" onclick="cpuManager.toggleDropdown('series')">
                                <span id="trigger-text-series">-- Chọn Dòng sản phẩm --</span>
                                <span>▼</span>
                            </div>
                            <div class="custom-dropdown-panel shadow-sm border rounded mt-1 bg-white">
                                <ul class="custom-options-list list-unstyled m-0" id="options-list-series"></ul>
                                <div class="custom-add-box d-flex p-2 border-top">
                                    <input type="text" id="add-input-series" class="form-control form-control-sm me-2" placeholder="Nhập Dòng sản phẩm mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();cpuManager.addCustomOption('series', 'add-input-series');}" />
                                    <button type="button" class="btn btn-sm btn-primary text-nowrap" onclick="cpuManager.addCustomOption('series', 'add-input-series')">+ Thêm</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 4. Phân khúc (Custom Dropdown) -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Phân khúc:</label>
                        <div class="custom-select-container" id="select-container-segment">
                            <input type="hidden" name="segment" id="cpuSegment" value="" />
                            <div class="custom-select-trigger form-control d-flex justify-content-between align-items-center" onclick="cpuManager.toggleDropdown('segment')">
                                <span id="trigger-text-segment">-- Chọn Phân khúc --</span>
                                <span>▼</span>
                            </div>
                            <div class="custom-dropdown-panel shadow-sm border rounded mt-1 bg-white">
                                <ul class="custom-options-list list-unstyled m-0" id="options-list-segment"></ul>
                                <div class="custom-add-box d-flex p-2 border-top">
                                    <input type="text" id="add-input-segment" class="form-control form-control-sm me-2" placeholder="Nhập Phân khúc mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();cpuManager.addCustomOption('segment', 'add-input-segment');}" />
                                    <button type="button" class="btn btn-sm btn-primary text-nowrap" onclick="cpuManager.addCustomOption('segment', 'add-input-segment')">+ Thêm</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Model:</label>
                        <input type="text" name="modelNumber" id="cpuModelNumber" class="form-control" placeholder="VD: 12400, 5600X" oninput="cpuManager.generateNameCallback()" />
                    </div>

                    <!-- 6. Hậu tố (Custom Dropdown) -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Hậu tố (có thể để trống):</label>
                        <div class="custom-select-container" id="select-container-suffix">
                            <input type="hidden" name="suffix" id="cpuSuffix" value="" />
                            <div class="custom-select-trigger form-control d-flex justify-content-between align-items-center" onclick="cpuManager.toggleDropdown('suffix')">
                                <span id="trigger-text-suffix">-- Chọn Hậu tố --</span>
                                <span>▼</span>
                            </div>
                            <div class="custom-dropdown-panel shadow-sm border rounded mt-1 bg-white">
                                <ul class="custom-options-list list-unstyled m-0" id="options-list-suffix"></ul>
                                <div class="custom-add-box d-flex p-2 border-top">
                                    <input type="text" id="add-input-suffix" class="form-control form-control-sm me-2" placeholder="Nhập Hậu tố mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();cpuManager.addCustomOption('suffix', 'add-input-suffix');}" />
                                    <button type="button" class="btn btn-sm btn-primary text-nowrap" onclick="cpuManager.addCustomOption('suffix', 'add-input-suffix')">+ Thêm</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Socket (Custom Dropdown) -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Socket (*):</label>
                        <div class="custom-select-container" id="select-container-socket">
                            <input type="hidden" name="socket" id="cpuSocket" value="" />
                            <div class="custom-select-trigger form-control d-flex justify-content-between align-items-center" onclick="cpuManager.toggleDropdown('socket')">
                                <span id="trigger-text-socket">-- Chọn Socket --</span>
                                <span>▼</span>
                            </div>
                            <div class="custom-dropdown-panel shadow-sm border rounded mt-1 bg-white">
                                <ul class="custom-options-list list-unstyled m-0" id="options-list-socket"></ul>
                                <div class="custom-add-box d-flex p-2 border-top">
                                    <input type="text" id="add-input-socket" class="form-control form-control-sm me-2" placeholder="Nhập Socket mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();cpuManager.addCustomOption('socket', 'add-input-socket');}" />
                                    <button type="button" class="btn btn-sm btn-primary text-nowrap" onclick="cpuManager.addCustomOption('socket', 'add-input-socket')">+ Thêm</button>
                                </div>
                            </div>
                        </div>
                        <span class="text-danger small" id="err-socket"></span>
                    </div>

                    <!-- 7. Số nhân -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Số nhân (*):</label>
                        <input type="number" name="coreCount" id="cpuCoreCount" class="form-control" placeholder="VD: 6, 8, 16" min="1" />
                        <span class="text-danger small" id="err-coreCount"></span>
                    </div>

                    <!-- 8. Số luồng -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Số luồng (*):</label>
                        <input type="number" name="threadCount" id="cpuThreadCount" class="form-control" placeholder="VD: 12, 16, 32" min="1" />
                        <span class="text-danger small" id="err-threadCount"></span>
                    </div>

                    <hr class="my-4" />

                    <!-- Fragment chứa Giá, Tồn kho, Ảnh, Mô tả -->
                    <div th:replace="~{common/product-fields :: fields(prefix='cpu')}"></div>

                    <div class="modal-footer border-0 px-0 pb-0">
                        <button type="button" class="btn btn-secondary fw-bold px-4" id="cancelModalBtn" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary fw-bold px-4">Lưu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
    <script th:src="@{/js/component-form.js}"></script>
    <script th:src="@{/js/cpu.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const existingCpus = /*[[${cpus}]]*/ [];
        /*]]>*/
    </script>
</div>
</body>
</html>
