<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="cpuModalForm">
    <link rel="stylesheet" th:href="@{/css/cpu.css}" />
<!-- The Modal -->
<div id="cpuModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeModalBtn">&times;</span>
        <h2 id="modalTitle">Thêm CPU mới</h2>
        
        <div class="success-alert" id="successAlert">Lưu thành công!</div>

        <form id="cpuAjaxForm">
            <input type="hidden" name="id" id="cpuId" />
            
            <!-- 1. Tên CPU -->
            <div class="form-group">
                <label>Tên CPU (*):</label>
                <input type="text" name="name" id="cpuName" placeholder="Tên CPU sẽ tự động sinh hoặc tự sửa..." />
                <div class="hint-text">(Tự động sinh theo cấu trúc [Hãng] [Dòng] [Phân khúc] [Model][Hậu tố], có thể chỉnh sửa)</div>
                <span class="error-msg" id="err-name"></span>
            </div>

            <!-- 2. Hãng CPU (Custom Dropdown) -->
            <div class="form-group">
                <label>Hãng CPU (*):</label>
                <div class="custom-select-container" id="select-container-brand">
                    <input type="hidden" name="brand" id="cpuBrand" value="" />
                    <div class="custom-select-trigger" onclick="toggleDropdown('brand')">
                        <span id="trigger-text-brand">-- Chọn Hãng --</span>
                        <span>▼</span>
                    </div>
                    <div class="custom-dropdown-panel">
                        <ul class="custom-options-list" id="options-list-brand"></ul>
                        <div class="custom-add-box">
                            <input type="text" id="add-input-brand" placeholder="Nhập Hãng CPU mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();addCustomOption('brand');}" />
                            <button type="button" onclick="addCustomOption('brand')">+ Thêm</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. Dòng sản phẩm (Custom Dropdown) -->
            <div class="form-group">
                <label>Dòng sản phẩm:</label>
                <div class="custom-select-container" id="select-container-series">
                    <input type="hidden" name="series" id="cpuSeries" value="" />
                    <div class="custom-select-trigger" onclick="toggleDropdown('series')">
                        <span id="trigger-text-series">-- Chọn Dòng sản phẩm --</span>
                        <span>▼</span>
                    </div>
                    <div class="custom-dropdown-panel">
                        <ul class="custom-options-list" id="options-list-series"></ul>
                        <div class="custom-add-box">
                            <input type="text" id="add-input-series" placeholder="Nhập Dòng sản phẩm mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();addCustomOption('series');}" />
                            <button type="button" onclick="addCustomOption('series')">+ Thêm</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4. Phân khúc (Custom Dropdown) -->
            <div class="form-group">
                <label>Phân khúc:</label>
                <div class="custom-select-container" id="select-container-segment">
                    <input type="hidden" name="segment" id="cpuSegment" value="" />
                    <div class="custom-select-trigger" onclick="toggleDropdown('segment')">
                        <span id="trigger-text-segment">-- Chọn Phân khúc --</span>
                        <span>▼</span>
                    </div>
                    <div class="custom-dropdown-panel">
                        <ul class="custom-options-list" id="options-list-segment"></ul>
                        <div class="custom-add-box">
                            <input type="text" id="add-input-segment" placeholder="Nhập Phân khúc mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();addCustomOption('segment');}" />
                            <button type="button" onclick="addCustomOption('segment')">+ Thêm</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 5. Model -->
            <div class="form-group">
                <label>Model:</label>
                <input type="text" name="modelNumber" id="cpuModelNumber" placeholder="VD: 12400, 5600X" oninput="autoGenerateCpuName()" />
            </div>

            <!-- 6. Hậu tố (Custom Dropdown) -->
            <div class="form-group">
                <label>Hậu tố (có thể để trống):</label>
                <div class="custom-select-container" id="select-container-suffix">
                    <input type="hidden" name="suffix" id="cpuSuffix" value="" />
                    <div class="custom-select-trigger" onclick="toggleDropdown('suffix')">
                        <span id="trigger-text-suffix">-- Chọn Hậu tố --</span>
                        <span>▼</span>
                    </div>
                    <div class="custom-dropdown-panel">
                        <ul class="custom-options-list" id="options-list-suffix"></ul>
                        <div class="custom-add-box">
                            <input type="text" id="add-input-suffix" placeholder="Nhập Hậu tố mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();addCustomOption('suffix');}" />
                            <button type="button" onclick="addCustomOption('suffix')">+ Thêm</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Socket (Custom Dropdown) -->
            <div class="form-group">
                <label>Socket (*):</label>
                <div class="custom-select-container" id="select-container-socket">
                    <input type="hidden" name="socket" id="cpuSocket" value="" />
                    <div class="custom-select-trigger" onclick="toggleDropdown('socket')">
                        <span id="trigger-text-socket">-- Chọn Socket --</span>
                        <span>▼</span>
                    </div>
                    <div class="custom-dropdown-panel">
                        <ul class="custom-options-list" id="options-list-socket"></ul>
                        <div class="custom-add-box">
                            <input type="text" id="add-input-socket" placeholder="Nhập Socket mới..." onkeypress="if(event.key==='Enter'){event.preventDefault();addCustomOption('socket');}" />
                            <button type="button" onclick="addCustomOption('socket')">+ Thêm</button>
                        </div>
                    </div>
                </div>
                <span class="error-msg" id="err-socket"></span>
            </div>

            <!-- Cc tru?ng thng tin chung du?c nhng t? fragment -->
            <div th:replace="~{common/product_form_fields :: commonFields('cpu')}"></div>
            <span class="error-msg" id="err-general"></span>

            <div class="modal-footer">
                <button type="button" id="cancelModalBtn">Hủy</button>
                <button type="submit">Lưu</button>
            </div>
        </form>
    </div>
</div>
    <script th:src="@{/js/cpu.js}"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const existingCpus = /*[[${cpus}]]*/ [];
    /*]]>*/
    
    // Đồng bộ các tuỳ chọn đã có trong database vào localStorage (đề phòng mở trên máy khác)
    if (existingCpus && Array.isArray(existingCpus)) {
        let changed = false;
        existingCpus.forEach(cpu => {
            ['brand', 'series', 'segment', 'suffix', 'socket'].forEach(key => {
                const val = cpu[key];
                if (val && val.trim() !== "" && !customDropdownData[key].includes(val)) {
                    customDropdownData[key].push(val);
                    changed = true;
                }
            });
        });
        if (changed) {
            saveCustomDropdownData();
            initCustomDropdowns(); // re-render if updated
        }
    }
</script>
</div>
</body>
</html>
