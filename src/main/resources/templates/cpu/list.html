<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách CPU</title>
</head>
<body>
<h1>Quản lý CPU</h1>
<button id="openCreateModalBtn">+ Thêm CPU mới</button>
<table border="1" cellpadding="8" cellspacing="0" style="margin-top:16px; border-collapse: collapse; width: 100%;" id="cpuTable">
    <thead>
    <tr>
        <th>STT</th>
        <th>Tên CPU</th>
        <th>Hãng</th>
        <th>Dòng</th>
        <th>Phân khúc</th>
        <th>Model</th>
        <th>Hậu tố</th>
        <th>Giá</th>
        <th>Tồn kho</th>
        <th>Socket</th>
        <th>Mô tả</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cpu, iterStat : ${cpus}" th:id="'cpu-row-' + ${cpu.id}">
        <td th:text="${iterStat.count}"></td>
        <td th:text="${cpu.name}"></td>
        <td th:text="${cpu.brand}"></td>
        <td th:text="${cpu.series}"></td>
        <td th:text="${cpu.segment}"></td>
        <td th:text="${cpu.modelNumber}"></td>
        <td th:text="${cpu.suffix != null && !cpu.suffix.isBlank() ? cpu.suffix : 'không có'}"></td>
        <td th:text="${cpu.price}"></td>
        <td th:text="${cpu.stock}"></td>
        <td th:text="${cpu.socket}"></td>
        <td th:text="${cpu.description != null && !cpu.description.isBlank() ? cpu.description : 'không có mô tả'}"></td>
        <td>
            <button type="button" style="cursor:pointer;" th:onclick="'editCpuModal(' + ${cpu.id} + ')'">Sửa</button>
            &nbsp;|&nbsp;
            <form th:action="@{/admin/cpu/{id}/delete(id=${cpu.id})}" method="post" style="display:inline">
                <button type="submit" onclick="return confirm('Xóa CPU này?')">Xóa</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(cpus)}" id="emptyRow">
        <td colspan="12">Chưa có CPU nào.</td>
    </tr>
    </tbody>
</table>

<!-- Nhúng Modal Form vào đây -->
<div th:replace="~{cpu/form :: cpuModalForm}"></div>
</body>
</html>
