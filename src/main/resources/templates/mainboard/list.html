<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Bo mạch chủ (Mainboard)</title>
</head>
<body>
<h1>Quản lý Bo mạch chủ (Mainboard)</h1>
<button id="openCreateModalBtn">+ Thêm Mainboard mới</button>
<table border="1" cellpadding="8" cellspacing="0" style="margin-top:16px; border-collapse: collapse; width: 100%;" id="mainboardTable">
    <thead>
    <tr>
        <th>STT</th>
        <th>Tên Mainboard</th>
        <th>Hãng</th>
        <th>Model</th>
        <th>Socket</th>
        <th>Chipset</th>
        <th>Chuẩn RAM</th>
        <th>Kích thước</th>
        <th>Giá</th>
        <th>Tồn kho</th>
        <th>Mô tả</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item, iterStat : ${mainboards}" th:id="'mainboard-row-' + ${item.id}">
        <td th:text="${iterStat.count}"></td>
        <td th:text="${item.name}"></td>
        <td th:text="${item.brand}"></td>
        <td th:text="${item.model}"></td>
        <td th:text="${item.socket}"></td>
        <td th:text="${item.chipset}"></td>
        <td th:text="${item.ramType}"></td>
        <td th:text="${item.formFactor}"></td>
        <td th:text="${item.price}"></td>
        <td th:text="${item.stock}"></td>
        <td th:text="${item.description != null && !item.description.isBlank() ? item.description : 'không có mô tả'}"></td>
        <td>
            <button type="button" style="cursor:pointer;" th:onclick="'mainboardManager.editItemModal(' + ${item.id} + ')'">Sửa</button>
            &nbsp;|&nbsp;
            <form th:action="@{/admin/mainboard/{id}/delete(id=${item.id})}" method="post" style="display:inline">
                <button type="submit" onclick="return confirm('Xóa Mainboard này?')">Xóa</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(mainboards)}" id="emptyRow">
        <td colspan="12">Chưa có Mainboard nào.</td>
    </tr>
    </tbody>
</table>

<!-- Nhúng Modal Form vào đây -->
<div th:replace="~{mainboard/form :: mainboardModalForm}"></div>
</body>
</html>
