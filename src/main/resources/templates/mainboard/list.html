<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/head :: head('Danh sách Bo mạch chủ (Mainboard)')}"></div>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}" th:with="isAdminPage=true"></div>

    <div class="admin-layout">
        <div th:replace="~{fragments/admin_sidebar :: adminSidebar('mainboard')}"></div>
        
        <main class="admin-content">
            <div class="admin-header">
                <h1>Quản lý Bo mạch chủ (Mainboard)</h1>
            </div>
            
            <button id="openCreateModalBtn" class="btn btn-primary mb-3">+ Thêm Mainboard mới</button>
            
            <div class="table-responsive bg-white rounded shadow-sm border">
                <table class="table table-hover mb-0 align-middle" id="mainboardTable">
    <thead class="table-light">
    <tr>
        <th>STT</th>
        <th>Tên Mainboard</th>
        <th>Hãng</th>
        <th>Model</th>
        <th>Socket</th>
        <th>Chipset</th>
        <th>Chuẩn RAM</th>
        <th>Kích thước</th>
        <th>Giá</th>
        <th>Tồn kho</th>
        <th>Mô tả</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item, iterStat : ${mainboards}" th:id="'mainboard-row-' + ${item.id}">
        <td th:text="${iterStat.count}"></td>
        <td th:text="${item.name}"></td>
        <td th:text="${item.brand}"></td>
        <td th:text="${item.model}"></td>
        <td th:text="${item.socket}"></td>
        <td th:text="${item.chipset}"></td>
        <td th:text="${item.ramType}"></td>
        <td th:text="${item.formFactor}"></td>
        <td th:text="${item.price}"></td>
        <td th:text="${item.stock}"></td>
        <td th:text="${item.description != null && !item.description.isBlank() ? item.description : 'không có mô tả'}"></td>
        <td>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-sm btn-outline-primary" th:onclick="'mainboardManager.editItemModal(' + ${item.id} + ')'">Sửa</button>
                <form th:action="@{/admin/mainboard/{id}/delete(id=${item.id})}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Xóa Mainboard này?')">Xóa</button>
                </form>
            </div>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(mainboards)}" id="emptyRow">
        <td colspan="12" class="text-center py-4 text-muted">Chưa có Mainboard nào.</td>
    </tr>
    </tbody>
</table>
</div>

<!-- Nhúng Modal Form vào đây -->
<div th:replace="~{mainboard/form :: mainboardModalForm}"></div>
        </main>
    </div>
</body>
</html>
