spring.application.name=computer-components
# 1. Cấu hình kết nối Database
spring.datasource.url=jdbc:mysql://localhost:3306/computer_components?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root@123

# 2. Cấu hình để Hibernate tự động sinh/cập nhật bảng
spring.jpa.hibernate.ddl-auto=update

# 3. Hiển thị câu lệnh SQL ra màn hình Console để dễ nhìn
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# -- spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect --

server.port=8080

# 4. Cấu hình Session & Cookie
# Tên Cookie quản lý Session
server.servlet.session.cookie.name=JSESSIONID
# max-age = -1 nghĩa là Session Cookie (trình duyệt tự xóa Cookie khi bị đóng)
server.servlet.session.cookie.max-age=-1
# Bảo vệ Cookie chống truy cập từ JS
server.servlet.session.cookie.http-only=true
# Duy trì Session lâu dài khi trình duyệt vẫn mở (7 ngày)
server.servlet.session.timeout=7d

# 5. Cấu hình upload file
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
